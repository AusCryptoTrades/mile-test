name: MILE private runner beta package
on:
  pull_request:
    branches: [feature/batch91-swimming]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  package:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/batch92-apple-health'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build staging web and unsigned iOS assets
        env:
          # Publishable MILE Staging browser key, as used by the combined beta.
          MILE_STAGING_PUBLISHABLE_KEY: sb_publishable_WDCwC-ubCFWHf0Z9yTuUMA_rabdgVDv
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash native/scripts/package-beta.sh "$RUNNER_TEMP/mile-private-beta"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mile-private-runner-beta
          path: ${{ runner.temp }}/mile-private-beta/
          retention-days: 14
          if-no-files-found: error
