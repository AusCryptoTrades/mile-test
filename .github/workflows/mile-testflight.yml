name: MILE private TestFlight
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact reviewed commit of the selected protected branch
        required: true
        type: string
      build_number:
        description: New increasing iOS build number
        required: true
        type: string
      upload:
        description: Upload to App Store Connect after signing and validation
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: mile-private-testflight
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref_type == 'branch' && github.ref_protected && inputs.reviewed_sha == github.sha
    runs-on: macos-26
    environment: mile-private-testflight
    timeout-minutes: 35
    env:
      MILE_IOS_BUNDLE_ID: ${{ vars.MILE_IOS_BUNDLE_ID }}
      MILE_NATIVE_STAGING_PUBLISHABLE_KEY: ${{ vars.MILE_NATIVE_STAGING_PUBLISHABLE_KEY }}
      MILE_APPLE_TEAM_ID: ${{ vars.MILE_APPLE_TEAM_ID }}
      MILE_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare staging-only iOS app
        run: |
          test -n "$MILE_IOS_BUNDLE_ID"
          test -n "$MILE_NATIVE_STAGING_PUBLISHABLE_KEY"
          [[ "$MILE_APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
          [[ "$MILE_BUILD_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]
          xcodebuild -version
          npm ci --prefix native --no-audit --no-fund
          npm --prefix native run prepare:ios
          grep -Fq 'data-mile-native-session="true"' native/www/index.html
          grep -Fq 'connect-src https://fnyfeelynaozxtftrrga.supabase.co' native/www/index.html
      - name: Sign, export and verify
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: bash native/scripts/testflight.sh archive
      - name: Upload signed build to App Store Connect
        if: inputs.upload
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: bash native/scripts/testflight.sh upload
      - name: Erase credentials and signed outputs
        if: always()
        run: bash native/scripts/testflight.sh cleanup
