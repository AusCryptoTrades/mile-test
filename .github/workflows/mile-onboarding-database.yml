name: MILE onboarding database
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/*_athlete_onboarding.sql'
      - 'supabase/tests/batch89-*'
      - 'docs/batch845-invitations.sql'
      - '.github/workflows/mile-onboarding-database.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  onboarding-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/batch89-fixtures.sql \
            -f supabase/migrations/20261127084450_athlete_onboarding.sql \
            -f supabase/tests/batch89-onboarding.test.sql
