name: MILE Swimming Stage 1
on:
  pull_request:
    branches: [codex/mile-cycling-batch90]
    paths:
      - '.github/workflows/mile-swimming-stage1.yml'
      - 'index.html'
      - 'mile-swimming-*.js'
      - 'mile-running-workout.js'
      - 'tests/batch91-swimming*.spec.js'
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run test:e2e -- tests/batch91-swimming.spec.js tests/batch91-swimming-ui.spec.js
