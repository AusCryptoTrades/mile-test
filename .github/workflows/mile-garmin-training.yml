name: MILE Garmin training contract
on:
  pull_request:
    branches: [main]
    paths: ['integrations/garmin/**', '.github/workflows/mile-garmin-training.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  training-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test integrations/garmin/*.test.mjs
