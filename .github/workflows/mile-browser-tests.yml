name: MILE browser tests
on:
  push:
    branches: [main, 'test/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: mile-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser-matrix:
    name: Browser (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-webkit, mobile-chromium]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify preinstalled Chromium and WebKit
        run: npx playwright install --list
      - name: Run browser project
        id: browser
        run: npm run test:e2e -- --project=${{ matrix.project }}
      - name: Summarize test outcome
        if: always()
        shell: bash
        env:
          BROWSER_PROJECT: ${{ matrix.project }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        run: |
          {
            echo "## MILE browser test report — $BROWSER_PROJECT"
            echo ''
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Branch/ref: `%s`\n' "$GITHUB_REF"
            printf -- '- Browser step: `%s`\n' "${BROWSER_OUTCOME:-skipped}"
            echo '- Browser tests drive the real app UI with synthetic backend data. Live Garmin, account access and native iOS behavior still need verification.'
            echo '- See Playwright HTML report artifact for screenshots and traces.'
            echo '- Do not mark a release ready for iPhone testing solely from this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mile-playwright-html-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7
      - name: Upload screenshots and traces if tests fail
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mile-playwright-failure-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  browser-tests:
    name: browser-tests
    needs: browser-matrix
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every browser project to pass
        env:
          MATRIX_RESULT: ${{ needs.browser-matrix.result }}
        run: |
          echo "Browser matrix result: $MATRIX_RESULT"
          test "$MATRIX_RESULT" = success
