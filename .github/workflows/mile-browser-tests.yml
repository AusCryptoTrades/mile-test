name: MILE browser tests
on:
  push:
    branches: [main, 'test/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: mile-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium and WebKit browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Run desktop and mobile browser tests
        run: npm run test:e2e
      - name: Summarize test outcome
        if: always()
        shell: bash
        run: |
          {
            echo '## MILE browser test report'
            echo ''
            echo '- Commit: `${{ github.sha }}`'
            echo '- Branch/ref: `${{ github.ref }}`'
            echo '- Result: `${{ job.status }}`'
            echo '- Tests include fixture-only checks and do **not** yet validate authenticated Activity Details, Garmin data or iOS Save to Photos.'
            echo '- See Playwright HTML report artifact for screenshots and traces.'
            echo '- Do not mark a release ready for iPhone testing solely from this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mile-playwright-html-report
          path: playwright-report/
          retention-days: 7
      - name: Upload screenshots and traces if tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mile-playwright-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
