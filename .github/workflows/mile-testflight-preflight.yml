name: MILE TestFlight signing preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify release gates
        run: |
          node native/scripts/testflight-preflight.mjs
      - name: Prepare native project
        working-directory: native
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run prepare:ios
      - name: Inspect signing configuration (no credentials)
        working-directory: native
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -showBuildSettings | grep -E 'PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|MARKETING_VERSION|CURRENT_PROJECT_VERSION'
