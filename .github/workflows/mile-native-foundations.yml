name: MILE native foundations
on:
  push:
    branches: ['feature/batch86-infrastructure']
    paths: ['native/**', '.github/workflows/mile-native-foundations.yml']
  pull_request:
    branches: [main, 'feature/batch85-beta-polish']
    paths: ['native/**', '.github/workflows/mile-native-foundations.yml', 'index.html', 'mile-*.html', 'mile-*.js', 'mile-*.css']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mile-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm --prefix native test
      - run: python3 native/scripts/brand.py --test
      - name: Resolve native dependency lockfile
        working-directory: native
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e 'const p=require("./package-lock.json"); if(p.lockfileVersion!==3 || !p.packages || !p.packages[""]) process.exit(1)'
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            node -e 'console.log("MILE_LOCKFILE_BEGIN"); console.log(JSON.stringify(require("./package-lock.json"))); console.log("MILE_LOCKFILE_END")'
          fi
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git diff --exit-code -- package-lock.json
          fi
      - name: Upload reproducible dependency lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mile-native-dependency-lock
          path: native/package-lock.json
          if-no-files-found: error
          retention-days: 7
  android-debug:
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Select Java 21
        run: |
          test -n "$JAVA_HOME_21_X64"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - run: npm install --no-audit --no-fund
      - run: npm run prepare:android
      - name: Restore Gradle dependency cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: mile-gradle-${{ runner.os }}-java21-${{ hashFiles('native/package.json', 'native/package-lock.json', 'native/android/**/*.gradle', 'native/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Compile Android debug application
        run: |
          cd android
          set -o pipefail
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon --max-workers=2 2>&1 | tee "$RUNNER_TEMP/mile-gradle.log"; then
              break
            fi
            if ! grep -Eq '429|Too Many Requests' "$RUNNER_TEMP/mile-gradle.log" || [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Dependency server rate limited the build; retrying after backoff."
            sleep "$((attempt * 60))"
          done
          test -s app/build/outputs/apk/debug/app-debug.apk
          grep -q 'android.permission.ACCESS_FINE_LOCATION' app/src/main/AndroidManifest.xml
  ios-simulator:
    needs: bundle
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: xcodebuild -version
      - run: npm install --no-audit --no-fund
      - run: npm run prepare:ios
      - name: Compile unsigned iOS simulator application
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build-ios CODE_SIGNING_ALLOWED=NO build
          test -d build-ios/Build/Products/Debug-iphonesimulator/App.app
          /usr/libexec/PlistBuddy -c 'Print :NSLocationWhenInUseUsageDescription' build-ios/Build/Products/Debug-iphonesimulator/App.app/Info.plist
          plutil -lint build-ios/Build/Products/Debug-iphonesimulator/App.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :NSHealthShareUsageDescription' build-ios/Build/Products/Debug-iphonesimulator/App.app/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.healthkit' ios/App/App/MILEHealthKit.entitlements)" = true
          grep -q 'registerPluginInstance(MILEHealthKitPlugin())' ios/App/App/AppDelegate.swift
          grep -q 'customClass="MILEBridgeViewController"' ios/App/App/Base.lproj/Main.storyboard
