'use strict';
const screens={"forgot":"<div class=\"eyebrow\">MAKE IT LOOK EASY.</div><h2>Reset your password.</h2><p class=\"intro\">Enter your account email to request a secure reset link.</p><div class=\"field\"><label>Email address<input id=\"recoveryEmail\" type=\"email\" placeholder=\"you@example.com\" autocomplete=\"username\"></label></div><button class=\"primary\" onclick=\"requestReset()\">Send reset link &nbsp; →</button><p class=\"center small\"><a href=\"https://app.milefitness.com.au/\">← Back to sign in</a></p>","sent":"<div class=\"successmark\">✓</div><div class=\"eyebrow\">MAKE IT LOOK EASY.</div><h2>Check your inbox.</h2><p class=\"intro\">If an account exists for that email, you’ll receive instructions to reset your password.</p><button class=\"primary\" onclick=\"backToLogin()\">Back to sign in &nbsp; →</button><p class=\"small center\">Check spam or junk if the email doesn’t arrive.</p>","reset":"<div class=\"eyebrow\">MAKE IT LOOK EASY.</div><h2>Create a new password.</h2><p class=\"intro\">Choose a strong password for your MILE account.</p><div class=\"field\"><label>New password</label><div class=\"pw\"><input id=\"newPassword\" aria-label=\"New password\" type=\"password\" placeholder=\"Enter password\" autocomplete=\"new-password\"><button type=\"button\" onclick=\"togglePassword(this)\">Show</button></div></div><div class=\"field\"><label>Confirm password</label><div class=\"pw\"><input id=\"confirmPassword\" aria-label=\"Confirm password\" type=\"password\" placeholder=\"Enter password\" autocomplete=\"new-password\"><button type=\"button\" onclick=\"togglePassword(this)\">Show</button></div></div><button class=\"primary\" onclick=\"updatePassword()\">Update password &nbsp; →</button>","done":"<div class=\"successmark\">✓</div><div class=\"eyebrow\">ACCOUNT SECURITY</div><h2>Password updated.</h2><p class=\"intro\">Your new password is ready. Sign in to continue.</p><button class=\"primary\" onclick=\"backToLogin()\">Sign in →</button>","invalid":"<div class=\"eyebrow\">ACCOUNT RECOVERY</div><h2>Request a new link.</h2><p class=\"intro\">This reset link is invalid or expired. Request another secure link.</p><button class=\"primary\" onclick=\"show('forgot')\">Request reset link →</button>"};
const API='https://mgixvokjlytjuypzcfzz.supabase.co/auth/v1/',KEY="sb_publishable_gIQO8rNBD9kKQpQdky0-7w_2A55HzO8",REDIRECT='https://app.milefitness.com.au/mile-reset-password.html';
let recoveryToken='',busy=false;
const content=document.getElementById('content'),statusEl=document.getElementById('status');
function show(mode){content.innerHTML=screens[mode];statusEl.textContent='';document.getElementById('tag').textContent='RECOVERY';}
function message(text){statusEl.textContent=text}
function togglePassword(b){const i=b.previousElementSibling;i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'Show':'Hide';}
function backToLogin(){location.replace('https://app.milefitness.com.au/')}
async function call(path,options={}){return fetch(API+path,{...options,cache:'no-store',referrerPolicy:'no-referrer',headers:{apikey:KEY,'Content-Type':'application/json',...(options.headers||{})},signal:AbortSignal.timeout(15000)})}
function lock(value){busy=value;content.querySelectorAll('button').forEach(b=>b.disabled=value)}
async function requestReset(){if(busy)return;const email=document.getElementById('recoveryEmail');if(!email.value.trim()||!email.checkValidity()){message('Enter a valid email address.');return}lock(true);try{const res=await call('recover?redirect_to='+encodeURIComponent(REDIRECT),{method:'POST',body:JSON.stringify({email:email.value.trim()})});if(res.status===429){message('Please wait before requesting another link.');return}if(res.status>=500){message('Email delivery is temporarily unavailable. Try again later.');return}if(!res.ok&&res.status!==400&&res.status!==422){message('Unable to request a link. Please try again.');return}show('sent')}catch{message('Unable to connect. Please try again.')}finally{lock(false)}}
async function updatePassword(){if(busy||!recoveryToken)return;const p=document.getElementById('newPassword').value,c=document.getElementById('confirmPassword').value;if(p.length<8){message('Choose a password with at least 8 characters.');return}if(p!==c){message('Passwords do not match.');return}lock(true);try{const res=await call('user',{method:'PUT',headers:{Authorization:'Bearer '+recoveryToken},body:JSON.stringify({password:p})});if(res.status===401||res.status===403){recoveryToken='';show('invalid');return}if(!res.ok){message('Password could not be updated. Choose a different password or request a new link.');return}const savedToken=recoveryToken;recoveryToken='';try{await call('logout?scope=global',{method:'POST',headers:{Authorization:'Bearer '+savedToken}})}catch{}show('done')}catch{message('Unable to connect. Please try again.')}finally{lock(false)}}
(async()=>{const hash=new URLSearchParams(location.hash.slice(1)),query=new URLSearchParams(location.search);const candidate=hash.get('access_token');const isRecovery=hash.get('type')==='recovery';const hadLink=!!location.hash||query.has('error')||query.has('error_code')||query.has('code');history.replaceState(null,'',location.pathname);if(!hadLink){show('forgot');return}if(!isRecovery||!candidate){show('invalid');return}try{const res=await call('user',{headers:{Authorization:'Bearer '+candidate}});if(!res.ok){show('invalid');return}recoveryToken=candidate;show('reset')}catch{show('invalid')}})();
