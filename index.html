.card{background:#191c20;border-color:#30363b}

reate account','signUp()','alt')}${b('Sign out','signOut()','alt')}</div><p id="sbDiagnostic" class="small warning" style="margin-top:10px"></p><p class="small muted" style="margin-top:10px">Status: ${token?'Signed in — sync enabled':'Not signed in'}. On first sign-in, existing cloud data is loaded if present; otherwise your current local plan is uploaded.</p>`,'half')}${c('Backup and restore',`<p class="muted small">Export a copy before major changes. Import replaces the current local state.</p><div class="row" style="margin-top:12px">${b('Export JSON backup','exportBackup()')}${b('Import JSON backup','document.getElementById(\'backupFile\').click()','alt')}</div><input id="backupFile" type="file" accept="application/json" style="display:none" onchange="importBackup(this)">`,'half')}${c('Data & privacy',`<p class="muted small">Your GitHub Pages site is public, but your private dashboard read key is not embedded in the HTML. The Cloudflare Worker forwards that key to Google Apps Script. Supabase private data requires correctly configured row-level security. Cloud sync does not include the Garmin read key.</p><p class="small warning" style="margin-top:10px">Never paste your Garmin API key or Supabase service-role key into this page or public GitHub.</p>`,'half')}</div>`}
function saveCloudConfig(){let u=document.getElementById('sbUrl').value.trim().replace(/\/$/,''),a=document.getElementById('sbAnon').value.trim();if(u&&!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(u))return notice('Enter a valid Supabase project URL');state.settings.supabaseUrl=u;state.settings.supabaseAnon=a;save();notice('Cloud configuration saved locally')}
async function testSupabase(){
 const el=document.getElementById('sbDiagnostic');
 const url=document.getElementById('sbUrl').value.trim().replace(/\/$/,'');
 const key=document.getElementById('sbAnon').value.trim();
 if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)){el.textContent='Invalid URL format. Copy the project URL, not the /rest/v1/ endpoint.';return;}
 el.textContent='Testing '+url+' …';
 try{
   const r=await fetch(url+'/auth/v1/settings',{headers:{apikey:key},cache:'no-store'});
   const body=await r.text();
   if(r.ok){el.textContent='Connection successful (HTTP '+r.status+'). You can now create an account.';}
   else {el.textContent='Server reached (HTTP '+r.status+'). Check that the publishable key belongs to this exact project. '+body.slice(0,140);}
 }catch(e){el.textContent='Cannot reach '+url+' — '+e.message+'. Check the exact hostname in Supabase and whether your network or DNS blocks it.';}
}

function suggestMatches(){let ignored=state.matches||{};let out=[];for(let a of activities()){let ds=String(a.date).slice(0,10);for(let w of workouts()){if(w.date!==ds||w.matchId||w.status==='skipped'||ignored[w.id+'|'+a.id])continue;let compatible=isRun(a)?['Running','HYROX'].includes(w.sport):/strength/i.test(a.type)?['Strength','HYROX'].includes(w.sport):String(a.type).toLowerCase().includes(w.sport.toLowerCase());if(compatible&&!state.workouts.some(x=>String(x.matchId)===String(a.id)))out.push({w,a})}}return out}

function mergeGarminPayload(data){if(!Array.isArray(data.activities))throw Error('Unexpected activity response');let old=new Map(state.activities.map(a=>[String(a.id),a]));for(let a of data.activities){if(!a.id||!/^[a-zA-Z0-9_-]+$/.test(String(a.id)))continue;let d=typeof a.date==='string'?a.date:(a.date?new Date(a.date).toISOString():'');if(d.slice(0,10)<START)continue;old.set(String(a.id),{...a,date:d})}state.activities=[...old.values()];let raw=Array.isArray(data.recovery)?data.recovery:Array.isArray(data.recoveryDays)?data.recoveryDays:Array.isArray(data.dailyRecovery)?data.dailyRecovery:Array.isArray(data.wellness)?data.wellness:[];if(raw.length){let days=new Map(recoveryRecords().map(r=>[String(r.date||r.day||r.calendarDate).slice(0,10),r]));for(let r of raw){let d=String(r.date||r.day||r.calendarDate||'').slice(0,10);if(/^\d{4}-\d{2}-\d{2}$/.test(d))days.set(d,{...days.get(d),...r,date:d})}state.recoveryDays=[...days.values()].sort((a,b)=>String(a.date).localeCompare(String(b.date)))}state.settings.lastGarminSync=new Date().toISOString()}
async function fetchGarmin(){let key=document.getElementById('garminKey')?.value.trim()||state.settings.garminKey;if(!key)return notice('Enter dashboard read key in Settings');state.settings.garminKey=key;localStorage.setItem('av-training-v2',JSON.stringify(state));notice('Refreshing Garmin data…');try{let r=await fetch(GARMIN_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});let data=await r.json();if(!r.ok||data.error)throw Error(data.error||'HTTP '+r.status);mergeGarminPayload(data);save();notice('Garmin synced: '+data.activities.length+' activities, '+recoveryRecords().length+' recovery days')}catch(e){notice('Garmin connection failed: '+e.message)}}

// Serialize writes per account. Never let an older in-flight request overwrite a newer edit.
let avCloudQueue=Promise.resolve(),avCloudPending=0,avCloudError='';
function avCloudIndicator(){let el=document.getElementById('avCloudStatus');if(!el)return;el.textContent=avCloudError?'Cloud save failed — check connection':avCloudPending?'Saving to cloud…':'Cloud saved';el.style.color=avCloudError?'#ff9999':''}
function cloudSave(){
 if(!token||!userId||!state.settings.supabaseUrl||!state.settings.supabaseAnon)return Promise.reject(Error('Cloud is not configured'));
 const owner=userId,url=state.settings.supabaseUrl,anon=state.settings.supabaseAnon,payload=cloudPayload(),stamp=new Date().toISOString();
 avCloudPending++;avCloudError='';avCloudIndicator();
 const job=async()=>{if(owner!==userId||!token)throw Error('Session changed before save');let headers={'apikey':anon,'Authorization':'Bearer '+token,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'};let r=await fetch(url+'/rest/v1/av_training_data?on_conflict=user_id',{method:'POST',headers,body:JSON.stringify({user_id:owner,training_data:payload,updated_at:stamp})});if(r.status===401&&await refreshSession()){headers.Authorization='Bearer '+token;r=await fetch(url+'/rest/v1/av_training_data?on_conflict=user_id',{method:'POST',headers,body:JSON.stringify({user_id:owner,training_data:payload,updated_at:stamp})})}if(!r.ok)throw Error('HTTP '+r.status+' '+(await r.text()).slice(0,120));localStorage.setItem('av-cloud-confirmed-'+owner,stamp)};
 const result=avCloudQueue.catch(()=>{}).then(job);avCloudQueue=result.catch(()=>{});result.then(()=>{avCloudPending--;avCloudIndicator()},e=>{avCloudPending--;avCloudError=e.message;avCloudIndicator()});return result;
}
async function cloudLoad(retry=true){let r=await fetch(state.settings.supabaseUrl+'/rest/v1/av_training_data?user_id=eq.'+encodeURIComponent(userId)+'&select=training_data',{headers:sbHeaders()});if(r.status===401&&retry&&await refreshSession())return cloudLoad(false);if(!r.ok)throw Error('Cloud read HTTP '+r.status);let rows=await r.json();if(rows.length&&rows[0].training_data){let settings=state.settings,localRecoverySnapshot=recoveryRecords();state=rows[0].training_data;if(!Array.isArray(state.recoveryDays)||!state.recoveryDays.length)state.recoveryDays=localRecoverySnapshot;state.settings={...state.settings,...settings,garminKey:settings.garminKey};for(let k of Object.keys(defaults))if(state[k]===undefined)state[k]=defaults[k];localStorage.setItem('av-training-v2',JSON.stringify(state));render()}else await cloudSave()}
function sbConfig(){return state.settings.supabaseUrl&&state.settings.supabaseAnon}

function v46ChooseDays(available, count, preferred, start, weeks){
 const days=[...new Set(available.map(Number))].sort((a,b)=>a-b);
 const end=add(start,weeks*7-1);
 const busy=state.workouts.filter(w=>w.date>=start&&w.date<=end&&w.status!=='skipped'&&v456Visible(w.block));
 const datesByDay=Array.from({length:7},()=>[]);
 for(let k=0;k<weeks*7;k++){let dt=add(start,k);if(dt>end)break;datesByDay[(date(dt).getDay()+6)%7].push(dt)}
 const hard=w=>/interval|threshold|tempo|speed|compromised|race|hard/i.test((w.name||'')+' '+(w.detail||''));
 let best=null, bestScore=Infinity;
 function visit(index,chosen){
  if(chosen.length===count){
   const picked=new Set(chosen);let score=0;
   for(const d of chosen)for(const dt of datesByDay[d]){
    const same=busy.filter(w=>w.date===dt);
    score+=same.length*14+same.filter(hard).length*8;
    const prev=busy.filter(w=>w.date===add(dt,-1)&&hard(w));
    const next=busy.filter(w=>w.date===add(dt,1)&&hard(w));
    score+=(prev.length+next.length)*2;
   }
   // Avoid unnecessarily clustering new sessions, but allow consecutive days if needed.
   for(const d of chosen)if(picked.has((d+1)%7))score+=3;
   if(days.includes(preferred)&&!picked.has(preferred))score+=5;
   if(score<bestScore){bestScore=score;best=chosen.slice()}
   return;
  }
  if(index>=days.length||chosen.length+days.length-index<count)return;
  visit(index+1,[...chosen,days[index]]);visit(index+1,chosen);
 }
 visit(0,[]);return (best||days.slice(0,count)).sort((a,b)=>a-b);
}

    el.innerHTML='<summary>HR Zones - Tap to view</summary><div class="mile-v31-zones">'+ranges.map((z,i)=>'<div class="v44-zone"><strong>Z'+(i+1)+' · '+esc(v451ZoneNames[i])+'</strong><p>'+z.min+'–'+z.max+' bpm</p></div>').join('')+'</div>';
   });
   app.querySelectorAll('h3').forEach(h=>{
    if(!/^(All )?planned sessions\s*\(/i.test(h.textContent))return;
    const list=h.nextElementSibling;
    if(!list?.classList.contains('list'))return;
    const d=document.createElement('details');d.className='mile-v3-details mile-v31-compact-sessions';

   });
   app.querySelectorAll('button').forEach(btn=>{
    if(/Manage Calendar Programs/i.test(btn.textContent))btn.classList.add('mile-v31-compact');
   });
  }
  if(page==='builder'){
   app.querySelectorAll('.sport-tile').forEach(tile=>{

    [...tile.children].forEach(ch=>{if(ch.tagName!=='STRONG')ch.remove()});
    tile.insertAdjacentHTML('afterbegin','<span class="mile-v31-sport-icon"><svg viewBox="0 0 24 24" aria-hidden="true">'+sportSvgs[sport]+'</svg></span>');
   });
   app.querySelectorAll('input[type="date"]').forEach(el=>{el.style.width='100%';el.style.minWidth='0'});
   app.querySelectorAll('button').forEach(btn=>{
    if(/^(Continue|Generate Program)/i.test(btn.textContent.trim())){btn.classList.remove('alt','ghost');btn.style.setProperty('background','#b8ff3b','important');btn.style.setProperty('color','#111','important')}
   });
  }
  if(page==='goals'){
   app.querySelectorAll('h2,h3').forEach(h=>{if(/race goals/i.test(h.textContent))h.textContent=h.textContent.replace(/race goals/i,'Planned Events')});

 };

</style><script id="mile-v32-code">(function(){

const clean=x=>esc(String(x??''));

const completed=w=>w.status==='done'||!!w.matchId;

 return '<div class="mile-v32-grid">'+(msgs.length?msgs.map(x=>'<div class="mile-v32-card"><div class="mile-v32-eyebrow">OBSERVED TREND</div><h3>'+clean(x.h)+'</h3><p>'+clean(x.b)+'</p></div>').join(''):'<div class="mile-v32-card">Import activities or record a recovery check-in to unlock your first insight.</div>')+'</div><p class="mile-v32-mini">Insights are automatic, rule-based observations, not medical diagnoses or AI-generated coaching advice.</p>'}
function eventPage(){const r=root();return '<div class="mile-v32-grid"><section class="mile-v32-card"><h3>Add an event</h3><div class="mile-v32-form"><div class="wide"><label>Event name</label><input id="m32EventName" maxlength="90" placeholder="e.g. Melbourne Marathon"></div><div><label>Date</label><input type="date" id="m32EventDate"></div><div><label>Sport</label><select id="m32EventSport"><option>Running</option><option>HYROX</option><option>Triathlon</option><option>Cycling</option><option>Swimming</option><option>Other</option></select></div><div><label>Distance / division</label><input id="m32EventDistance" placeholder="e.g. 21.1 km / Mixed Doubles"></div><div><label>Target time</label><input id="m32EventTarget" placeholder="e.g. 1:35:00"></div><div><label>Actual result (optional)</label><input id="m32EventResult" placeholder="e.g. 1:34:50"></div></div><button class="btn" onclick="mile32AddEvent()">Save event</button></section><section class="mile-v32-card"><h3>Personal bests</h3><div class="mile-v32-form"><div><label>Distance / event</label><select id="m32PbDistance"><option value="5">5 km</option><option value="10">10 km</option><option value="21.0975">Half marathon</option><option value="42.195">Marathon</option><option value="hyrox-single">HYROX Singles</option><option value="hyrox-double">HYROX Doubles</option></select></div><div><label>Time (h:mm:ss or mm:ss)</label><input id="m32PbTime" placeholder="e.g. 1:42:55"></div><div class="wide"><label>Date (optional)</label><input id="m32PbDate" type="date"></div></div><button class="btn" onclick="mile32AddPB()">Save PB</button><div class="mile-v32-rows" style="margin-top:14px">'+r.pbs.map((p,i)=>'<div class="mile-v32-row"><div><strong>'+clean(p.label)+'</strong><div class="mile-v32-mini">'+clean(p.time)+' '+clean(p.date)+'</div></div><div class="mile-pb-actions"><button class="btn sm" onclick="mileSharePB('+i+')">Save Image</button><button class="btn alt sm" onclick="mile32DeletePB('+i+')">Remove</button></di window.mile32AddEvent=()=>{const get=id=>document.getElementById(id)?.value.trim()||'';const name=get('m32EventName'),date=get('m32EventDate');if(!name||!safeDate(date))return notice('Enter an event name and date');root().events.push({id:'e'+Date.now(),name,date,sport:get('m32EventSport'),distance:get('m32EventDistance'),target:get('m32EventTarget'),result:get('m32EventResult')});save();notice('Event saved')};
window.mile32DeleteEventByIndex=i=>{if(!confirm('Remove this event?'))return;root().events.splice(i,1);save()};
function parseTime(s){const parts=s.split(':').map(Number);if(parts.some(n=>!Number.isFinite(n))||parts.length<2||parts.length>3||parts.some(n=>n<0))return null;if(parts.slice(1).some(n=>n>=60))return null;return parts.reduce((a,n)=>a*60+n,0)}
window.mile32AddPB=()=>{const label=document.getElementById('m32PbDistance').selectedOptions[0].textContent,dist=document.getElementById('m32PbDistance').value,time=document.getElementById('m32PbTime').value.trim(),date=document.getElementById('m32PbDate').value;if(!parseTime(time))return notice('Enter a valid time, such as 45:24 or 1:42:55');root().pbs.push({label,dist,time,date});save();notice('PB saved')};
window.mile32DeletePB=i=>{root().pbs.splice(i,1);save()};
function predictorPage(){return '<div class="mile-v32-grid"><section class="mile-v32-card"><h3>Running prediction</h3><p>Based on a manually entered PB or a comparable Garmin full-distance activity. Estimates use the Riegel distance model, with uncertainty increasing over longer distances.</p><div class="mile-v32-form" style="margin-top:14px"><div><label>Known result</label><select id="m32PredictSource"><option value="">Select a result</option>'+root().pbs.filter(p=>Number(p.dist)>0).map((p,i)=>'<option value="'+clean(p.dist)+'|'+clean(p.time)+'">'+clean(p.label)+' · '+clean(p.time)+'</option>').join('')+'</select></div><div><label>Target distance</label><select id="m32PredictDistance"><option value="5">5 km</option><option value="10">10 km</option><option value="21.0975">Half marathon</option><option value="42.195">Marathon</option></select></div></div><button class="btn" onclick="mile32PredictRun()">Calculate running estimate</button><div id="m32PredictRunResult" style="margin-top:14px"></div></section><section class="mile-v32-card"><h3>HYROX prediction</h3><p>Supports Singles and Doubles. A credible estimate needs a comparable HYROX result or sufficient station and running data. A running PB alone is not enough.</p><div class="mile-v32-form" style="margin-top:14px"><div><label>Division</label><select id="m32HyroxDivision"><option>Singles Open</option><option>Singles Pro</option><option>Doubles Men</option><option>Doubles Women</option><option>Doubles Mixed</option></select></div><div><label>Recent comparable result</label><select id="m32HyroxSource"><option value="">No previous HYROX result</option>'+root().pbs.filter(p=>p.dist.startsWith('hyrox')).map(p=>'<option value="'+clean(p.time)+'">'+clean(p.label)+' · '+clean(p.time)+'</option>').join('')+'</select></div></div><button class="btn" onclick="mile32PredictHyrox()">Review HYROX estimate</button><div id="m32PredictHyroxResult" style="margin-top:14px"></div></section></div>'}
function fmtSeconds(n){const s=Math.round(n);return Math.floor(s/3600)?Math.floor(s/3600)+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'):Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
window.mile32PredictRun=()=>{const source=document.getElementById('m32PredictSource').value,out=document.getElementById('m32PredictRunResult');if(!source){out.innerHTML='<p class="mile-v32-empty">Add a verified running PB under Events & PBs first.</p>';return}const [d,t]=source.split('|'),secs=parseTime(t),target=Number(document.getElementById('m32PredictDistance').value);if(!secs||!Number(d))return;const estimate=secs*Math.pow(target/Number(d),1.06),ratio=target/Number(d),margin=ratio>2?0.1:0.06;out.innerHTML=metric('ESTIMATED FINISH',fmtSeconds(estimate),'Indicative range: '+fmtSeconds(estimate*(1-margin))+' – '+fmtSeconds(estimate*(1+margin))+'. Based on '+clean(d)+' km in '+clean(t)+'. Not a guarantee.')};
window.mile32PredictHyrox=()=>{const out=document.getElementById('m32PredictHyroxResult'),time=document.getElementById('m32HyroxSource').value,division=document.getElementById('m32HyroxDivision').value;if(!time){out.innerHTML='<p class="mile-v32-empty">Insufficient HYROX data. Add a comparable result under Events & PBs; station splits and partner information would improve the estimate.</p>';return}out.innerHTML=metric('COMPARABLE RESULT',clean(time),'Your recorded HYROX result is a useful reference for '+clean(division)+', but without comparable division, station and partner data we cannot reliably forecast a new finish time.')};
function extraDashboard(){const w=thisWeek(),t=root().targets,done=w.planned.filter(completed).length,by=durationBySport(w.actual),r=recoverySummary(),fat=state.checkins?.[today()]?.fatigue;let readiness='Recovery data limited',reason='Record a check-in and sync Garmin recovery metrics for a fuller picture.';if(r.sleep!==null||fat){readiness='Ready to assess';reason='Sleep: '+(r.sleep===null?'not recorded':r.sleep.toFixed(1)+' h')+'; fatigue: '+(fat||'not recorded')+'/10. ';if((r.sleep!==null&&r.sleep<t.sleepHours-1)||(fat&&Number(fat)>=7)){readiness='Take it steady';reason+='At least one recovery indicator is below your preference.'}else if(r.sleep!==null&&fat){readiness='Feeling on track';reason+='No obvious warning from these two indicators.'}}return '<div class="mile-v32-grid">'+metric('TRAINING READINESS',clean(readiness),clean(reason)+' Guidance only, not a medical assessment.')+'<div class="mile-v32-card"><div class="mile-v32-eyebrow">WEEKLY COMPLETION</div><div class="mile-v32-big">'+done+' / '+w.planned.length+'</div>'+progress(done,w.planned.length)+'<p>Visible scheduled sessions completed or Garmin-linked.</p></div><div class="mile-v32-card"><h3>Training time by sport</h3><div class="mile-v32-rows">'+(Object.entries(by).length?Object.entries(by).map(([k,v])=>'<div class="mile-v32-row"><strong>'+clean(k)+'</strong><span>'+fmt(v)+'</span></div>').join(''):'<p>No recorded activity duration this week.</p>')+'</div></div></div>'}
let statDays=7;
window.mile32StatsDays=n=>{statDays=n;render()};
function extraStats(){const from=add(today(),1-statDays),arr=activities().filter(a=>String(a.date).slice(0,10)>=from&&String(a.date).slice(0,10)<=today()),by=durationBySport(arr),max=Math.max(1,...Object.values(by)),allMinutes=arr.reduce((s,a)=>s+mins(a),0),w=thisWeek(),done=w.planned.filter(completed).length;return '<section class="mile-v32-card"><h3>Hybrid training distribution</h3><div class="mile-v32-filter">'+[7,30,90].map(n=>'<button class="'+(statDays===n?'active':'')+'" onclick="mile32StatsDays('+n+')">'+n+' days</button>').join('')+'</div><div class="mile-v32-big">'+fmt(allMinutes)+'</div><p>Total recorded training time</p><div class="mile-v32-sport-graph" style="margin-top:14px">'+(Object.entries(by).length?Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<div class="mile-v32-graphrow"><strong>'+clean(k)+'</strong>'+progress(v,max)+'<span>'+fmt(v)+'</span></div>').join(''):'<p>No activities in this period.</p>')+'</div></section><section class="mile-v32-card"><h3>Weekly training consistency</h3><div class="mile-v32-big">'+percent(done,w.planned.length)+'%</div>'+progress(done,w.planned.length)+'<p>'+done+' of '+w.planned.length+' scheduled sessions completed or Garmin-linked this week.</p></section>'}
function extraRecovery(){const days=Array.from({length:7},(_,i)=>add(today(),i-6));return '<section class="mile-v32-card"><h3>Seven-day recovery comparison</h3><div class="mile-v32-rows">'+days.map(d=>{const r=recoveryDay(d),sleep=recoveryNumber(r,'sleepHours','sleep'),hrv=recoveryNumber(r,'hrvMs','overnightHrv','hrv'),fat=state.checkins?.[d]?.fatigue;return '<div class="mile-v32-row"><strong>'+clean(d.slice(5))+'</strong><span>Sleep '+(sleep===null?'—':sleep.toFixed(1)+'h')+' · HRV '+(hrv===null?'—':Math.round(hrv)+'ms')+' · Fatigue '+(fat||'—')+'/10</span></div>'}).join('')+'</div><p class="mile-v32-mini" style="margin-top:12px">Missing values are shown as dashes, never estimated.</p></section>'}
function targetForm(){const t=root().targets;return '<section class="mile-v32-card"><h3>Personal training targets</h3><div class="mile-v32-form"><div><label>Weekly running target (km)</label><input type="number" id="m32TargetRun" min="0" max="300" step="1" value="'+clean(t.runKm)+'"></div><div><label>Sleep target (hours)</label><input type="number" id="m32TargetSleep" min="4" max="12" step="0.5" value="'+clean(t.sleepHours)+'"></div><div><label>Training days per week</label><input type="number" id="m32TargetDays" min="1" max="7" value="'+clean(t.days)+'"></div><div><label>Primary sport</label><select id="m32TargetSport">'+['Running','HYROX','Swimming','Cycling','Triathlon','Strength'].map(x=>'<option '+(x===t.primarySport?'selected':'')+'>'+x+'</option>').join('')+'</select></div></div><button class="btn" onclick="mile32SaveTargets()">Save personal targets</button></section>'}
window.mile32SaveTargets=()=>{const n=id=>Number(document.getElementById(id)?.value),run=n('m32TargetRun'),sleep=n('m32TargetSleep'),days=n('m32TargetDays');if(!Number.isFinite(run)||run<0||run>300||sleep<4||sleep>12||!Number.isInteger(days)||days<1||days>7)return notice('Check your training targets');root().targets={runKm:run,sleepHours:sleep,days,primarySport:document.getElementById('m32TargetSport').value};save();notice('Personal targets saved')};
function activityDetails(){return '<section class="mile-v32-card"><h3>Garmin activity details</h3><p>Tap an activity to expand its recorded data.</p><div class="mile-v32-rows" style="margin-top:12px">'+activities().slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,30).map(a=>'<div class="mile-v32-row mile-v32-activity"><details style="width:100%"><summary><strong>'+clean(a.name||a.activityName||a.type)+'</strong> · '+clean(String(a.date).slice(0,10))+'</summary><div class="mile-v32-mini" style="margin-top:10px">Sport: '+clean(sportName(a))+' · Distance: '+Number(a.distanceKm||0).toFixed(2)+' km · Duration: '+fmt(mins(a))+(a.averageHR?' · Avg HR: '+Math.round(a.averageHR)+' bpm':'')+(a.paceMinKm?' · Pace: '+formatPace(a.paceMinKm):'')+'</div></details></div>').join('')+'</div></section>'}

async function m363UploadAvatar(file){
 if(!userId||!token)throw Error('Sign in before uploading a photo');
 if(file.size>15*1024*1024)throw Error('Please choose a photo smaller than 15 MB');
 if(!(/^image\//.test(file.type)||/\.(heic|heif)$/i.test(file.name)))throw Error('Please select an image');
 const bitmap=await new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('This photo format could not be opened on this device. Try JPG or PNG.'))};img.src=url});
 const canvas=document.createElement('canvas');canvas.width=512;canvas.height=512;const ctx=canvas.getContext('2d');const side=Math.min(bitmap.naturalWidth,bitmap.naturalHeight);ctx.drawImage(bitmap,(bitmap.naturalWidth-side)/2,(bitmap.naturalHeight-side)/2,side,side,0,0,512,512);
 const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('Could not prepare photo')),'image/jpeg',0.85));
 const path=userId+'/avatar.jpg';const url=state.settings.supabaseUrl+'/storage/v1/object/mile-avatars/'+path;
 const send=()=>fetch(url,{method:'POST',headers:{...sbHeaders(),'Content-Type':'image/jpeg','x-upsert':'true','cache-control':'3600'},body:blob});
 let res=await send();if(res.status===401&&await refreshSession())res=await send();
 if(!res.ok){let data=await res.json().catch(()=>({}));throw Error(data.message||data.error||'Photo upload failed ('+res.status+'). Check the mile-avatars Storage policies.')}
 return state.settings.supabaseUrl+'/storage/v1/object/public/mile-avatars/'+path+'?v='+Date.now();
}

 return `<section class="m36-panel m362-profile"><button class="m36-btn alt" data-m375-back="1">← Back</button>
 <div class="m362-cover"><span class="m36-kicker">MILE ATHLETE</span><span class="m362-privacy">${p.is_private===false?'Public':'Private'} profile</span></div>
 <div class="m362-identity">${avatar(p)}<div class="m362-person"><h2>${e(p.display_name||'MILE Athlete')}</h2><div class="muted">@${e(p.username||'athlete')}</div></div></div>
 ${canView&&p.bio?`<p style="padding:0 18px">${e(p.bio)}</p>`:''}
 ${canView?`<div class="m380-stats"><button data-m380-list="followers" data-m380-owner="${e(p.user_id)}"><strong>${followers}</strong><small>Followers ›</small></button><button data-m380-list="following" data-m380-owner="${e(p.user_id)}"><strong>${following}</strong><small>Following ›</small></button><div><strong>${posts.length}</strong><small>Shared workouts</small></div></div>`:''}
 <div class="m36-actions" style="padding:14px 18px"><button class="m36-btn alt" data-m37-open="${e(p.user_id)}">Message</button><button class="m36-btn" data-m36-follow="${e(p.user_id)}">${rel?(rel.status==='accepted'?'Following':'Requested'):'Follow'}</button></div>
 <div style="padding:14px 18px"><h3>RECENT ACTIVITIES</h3>${canView?posts.map(post).join('')||'<p class="muted">No shared workouts visible.</p>':'<p class="muted">Private profile. Follow this athlete to view approved workouts.</p>'}</div></section>`;
}
function m375PeopleList(){const who=S.peopleList,owner=S.peopleListOwner||userId;const ids=S.follows.filter(f=>f.status==='accepted'&&(who==='followers'?f.following_id===owner:f.follower_id===owner)).map(f=>who==='followers'?f.follower_id:f.following_id);return `<div class="m36-panel"><button class="m36-btn alt" data-m375-back="1">← Back</button><h2 style="margin-top:16px">${who==='followers'?'Followers':'Following'} · ${ids.length}</h2>${ids.map(id=>{const p=S.discovery.find(x=>x.user_id===id)||S.profiles.find(x=>x.user_id===id)||prof(id);return `<div class="m36-athlete m375-click-athlete" data-m375-profile="${e(id)}" role="button" tabindex="0">${avatar(p)}<div><strong>${e(p.display_name||'MILE Athlete')}</strong><small>@${e(p.username||'athlete')}</small></div><span>›</span></div>`}).join('')||'<p class="muted">No athletes yet.</p>'}</div>`}
document.addEventListener('click',async ev=>{
 const t=ev.target.closest('[data-m375-profile],[data-m375-list],[data-m375-back],[data-m375-menu],[data-m375-togglehidden]');if(!t)return;
 if(t.dataset.m375Profile){if(ev.target.closest('button,input,label'))return;m380OpenProfile(t.dataset.m375Profile);return}
 if(t.dataset.m375List){S.peopleList=t.dataset.m375List;S.peopleListOwner=userId;S.profileTarget=null;paint();return}
 if(t.dataset.m375Back){S.profileTarget=null;S.peopleList=null;S.tab=S.profileOrigin?.tab||'profile';if(S.profileOrigin?.peopleList)S.peopleList=S.profileOrigin.peopleList;paint();return}
 if(t.dataset.m375Togglehidden){S.showHiddenMessages=!S.showHiddenMessages;paint();return}
 if(t.dataset.m375Menu){S.messageMenu=S.messageMenu===t.dataset.m375Menu?null:t.dataset.m375Menu;paint();return}
});
document.addEventListener('click',async ev=>{
 const b=ev.target.closest('[data-m380-action],[data-m380-list],[data-m380-requests],[data-m380-sync],[data-m380-profile-link]');
 if(!b){if(S.messageMenu&&!ev.target.closest('[data-m375-menu]')){S.messageMenu=null;const popup=document.querySelector('.m380-popover');if(popup)popup.remove()}return}
 ev.preventDefault();
 if(b.dataset.m380ProfileLink){m380OpenProfile(b.dataset.m380ProfileLink);return}
 if(b.hasAttribute('data-m380-requests')){S.tab='requests';S.profileTarget=null;S.peopleList=null;await load();return}
 if(b.dataset.m380List){S.peopleList=b.dataset.m380List;S.peopleListOwner=b.dataset.m380Owner;S.profileTarget=null;paint();return}
 if(b.hasAttribute('data-m380-sync')){
  b.disabled=true;b.textContent='Syncing…';try{const count=(state.activities||[]).length;if(!count)throw Error('No Garmin activities are loaded in MILE. Import Garmin activities first, then try again.');await m37AutoShare();await load();notice('Garmin Social sync completed. Loaded '+count+' local activities.')}catch(err){notice('Garmin Social sync: '+err.message)}finally{if(b.isConnected){b.disabled=false;b.textContent='Sync Garmin to Social'}}return;
 }
 const m=S.messages.find(x=>String(x.id)===b.dataset.m380Id),act=b.dataset.m380Action;
 if(!m)return;S.messageMenu=null;
 try{
  if(act==='copy'){await navigator.clipboard.writeText(m.body);notice('Message copied');paint();return}
  if(act==='edit'){const body=prompt('Edit your message',m.body);if(body===null)return;const clean=body.trim();if(!clean||clean.length>2000)return notice('Message must be 1–2000 characters');await api('mile_messages','PATCH',{body:clean},'?id=eq.'+encodeURIComponent(m.id)+'&sender_id=eq.'+encodeURIComponent(userId))}
  if(act==='delete'){if(!confirm('Delete this message for everyone?'))return;await api('mile_messages','PATCH',{deleted_at:new Date().toISOString()},'?id=eq.'+encodeURIComponent(m.id)+'&sender_id=eq.'+encodeURIComponent(userId))}
  if(act==='hide')await api('mile_message_hides','POST',{message_id:m.id,user_id:userId});
  if(act==='restore')await api('mile_message_hides','DELETE',null,'?message_id=eq.'+encodeURIComponent(m.id)+'&user_id=eq.'+encodeURIComponent(userId));
  await loadMessages();paint();
 }catch(err){notice('Message action failed: '+err.message)}
});
document.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('[data-m375-profile]')){ev.preventDefault();m380OpenProfile(ev.target.dataset.m375Profile)}});

document.addEventListener('click',ev=>{
 const b=ev.target.closest('[data-m381-settings],[data-m381-back]');if(!b)return;
 ev.preventDefault();S.tab=b.hasAttribute('data-m381-settings')?'notification_settings':'notifications';paint();
});
document.addEventListener('change',ev=>{
 const k=ev.target.dataset.m381Pref;if(!k||!m381Kinds.includes(k))return;
 const prefs=m381Prefs();prefs[k]=ev.target.checked;
 try{localStorage.setItem('mile_notification_prefs_'+userId,JSON.stringify(prefs))}catch(_){}
 m379UpdateBadge();
});
document.addEventListener('click',async ev=>{
 const b=ev.target.closest('[data-m379-bell],[data-m379-open],[data-m379-readall]');if(!b)return;
 ev.preventDefault();
 if(b.hasAttribute('data-m379-bell')){S.tab='notifications';S.profileTarget=null;S.peopleList=null;paint();await m379LoadNotifications();return}
 if(b.hasAttribute('data-m379-readall')){
  try{await api('mile_app_notifications','PATCH',{is_read:true},'?recipient_id=eq.'+encodeURIComponent(userId)+'&is_read=eq.false');await m379LoadNotifications()}
  catch(err){notice('Notifications: '+err.message)}return;
 }
 const n=S.notifications.find(x=>x.id===b.dataset.m379Open);if(!n)return;
 try{if(!n.is_read)await api('mile_app_notifications','PATCH',{is_read:true},'?id=eq.'+encodeURIComponent(n.id)+'&recipient_id=eq.'+encodeURIComponent(userId))}
 catch(err){notice('Notifications: '+err.message)}
 if(n.kind==='message'){S.tab='messages';S.chatWith=n.actor_id;await loadMessages()}
 else if(n.kind==='follow_request'){S.tab='requests';S.chatWith=null;S.profileTarget=null;await load()}
 else if(n.kind==='follow'||n.kind==='follow_accepted'){S.tab='discover';await load();m380OpenProfile(n.actor_id)}
 else if(n.kind==='like'||n.kind==='comment'){S.tab='feed';S.feedFilter='everyone';S.profileTarget=null;await load()}
 else{S.tab='profile';await load()}
 paint();m379LoadNotifications();
});
setInterval(()=>{if(page==='social'&&userId&&!document.hidden)m379LoadNotifications()},12000);

setInterval(()=>{
 if(page==='social'&&S.tab==='messages'&&userId&&!S.loading&&!document.hidden)loadMessages();
},6000);
})();
</script></body></html>
