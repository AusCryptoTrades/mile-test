<style id="mile-profile-drawer-premium-20261118">
/* Shared avatar treatment: a fine ring, not a thick neon halo. */
.shell>.top .m36-head{background:transparent!important;border:0!important;box-shadow:none!important;padding:0!important;overflow:visible!important;display:grid!important;place-items:center!important}
.shell>.top .m36-head .m36-avatar{box-sizing:border-box!important;width:42px!important;height:42px!important;border:1.5px solid var(--orange)!important;border-radius:50%!important;padding:2px!important;background:var(--panel)!important;box-shadow:0 0 0 1px var(--panel2)!important;overflow:hidden!important;display:grid!important;place-items:center!important}
.shell>.top .m36-head .m36-avatar img{width:100%!important;height:100%!important;border-radius:50%!important;object-fit:cover!important;display:block!important}
/* Social menu: a compact bottom sheet on phones, restrained drawer on desktop. */
#m36-dim{position:fixed!important;inset:0!important;background:rgba(1,9,7,.72)!important;backdrop-filter:blur(5px)!important;z-index:2000!important}
#m36-drawer.mile-profile-drawer{box-sizing:border-box!important;position:fixed!important;z-index:2001!important;background:var(--panel)!important;border:1px solid var(--line)!important;box-shadow:0 24px 70px #0009!important;padding:18px!important;overflow-y:auto!important;overscroll-behavior:contain!important;display:block!important;right:16px!important;top:calc(env(safe-area-inset-top) + 12px)!important;bottom:auto!important;width:min(390px,calc(100vw - 32px))!important;max-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 24px)!important;border-radius:22px!important}
.mile-profile-drawer .mile-drawer-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.mile-profile-drawer .mile-drawer-heading h2{margin:3px 0 0;font-size:23px;letter-spacing:-.6px;line-height:1.2;color:#f4fff8}
.mile-profile-drawer .mile-drawer-heading h2 span{color:#86efb5}
.mile-profile-drawer .m36-kicker{font-size:9px!important;letter-spacing:1.8px!important}
#m36-drawer.mile-profile-drawer .m36-x{position:static!important;top:auto!important;right:auto!important;width:38px!important;height:38px!important;min-width:38px!important;margin:0!important;padding:8px!important;border-radius:11px!important;display:grid!important;place-items:center!important;background:var(--panel)!important;color:#e7f8ec!important}
.mile-profile-drawer .m36-x svg{width:20px;height:20px}
#m36-drawer.mile-profile-drawer .mile-drawer-person{width:100%!important;display:flex!important;align-items:center!important;gap:11px!important;text-align:left!important;background:linear-gradient(115deg,var(--panel),var(--panel))!important;border:1px solid var(--line)!important;padding:10px!important;margin:0 0 12px!important;border-radius:14px!important;min-height:62px!important}
.mile-drawer-person .m36-avatar{width:43px!important;height:43px!important;border:1.5px solid var(--orange)!important;padding:2px!important;background:var(--panel)!important;box-shadow:none!important}
.mile-drawer-person .m36-avatar img{border-radius:50%!important}

function v46ChooseDays(available, count, preferred, start, weeks){
 const days=[...new Set(available.map(Number))].sort((a,b)=>a-b);
 const end=add(start,weeks*7-1);
 const busy=state.workouts.filter(w=>w.date>=start&&w.date<=end&&w.status!=='skipped'&&v456Visible(w.block));
 const datesByDay=Array.from({length:7},()=>[]);
 for(let k=0;k<weeks*7;k++){let dt=add(start,k);if(dt>end)break;datesByDay[(date(dt).getDay()+6)%7].push(dt)}

 let best=null, bestScore=Infinity;
 function visit(index,chosen){
  if(chosen.length===count){
   const picked=new Set(chosen);let score=0;
   for(const d of chosen)for(const dt of datesByDay[d]){
    const same=busy.filter(w=>w.date===dt);
    score+=same.length*14+same.filter(hard).length*8;
    const prev=busy.filter(w=>w.date===add(dt,-1)&&hard(w));
    const next=busy.filter(w=>w.date===add(dt,1)&&hard(w));
    score+=(prev.length+next.length)*2;
   }
   // Avoid unnecessarily clustering new sessions, but allow consecutive days if needed.
   for(const d of chosen)if(picked.has((d+1)%7))score+=3;
   if(days.includes(preferred)&&!picked.has(preferred))score+=5;
   if(score<bestScore){bestScore=score;best=chosen.slice()}
   return;
  }
  if(index>=days.length||chosen.length+days.length-index<count)return;
  visit(index+1,[...chosen,days[index]]);visit(index+1,chosen);
 }
 visit(0,[]);return (best||days.slice(0,count)).sort((a,b)=>a-b);
}

</style><script id="mile-v32-code">(function(){
'use strict';
window.mile32Root=()=>state.mileV32||{pbs:[]};
const root=()=>{if(!state.mileV32||typeof state.mileV32!=='object')state.mileV32={};const r=state.mileV32;r.events??=[];r.pbs??=[];r.targets??={runKm:50,sleepHours:8,days:5,primarySport:'Running'};return r};
const clean=x=>esc(String(x??''));
const fmt=m=>{const n=Math.max(0,Math.round(Number(m)||0));return Math.floor(n/60)+'h '+String(n%60).padStart(2,'0')+'m'};
const mins=a=>Number(a.durationMin)||Number(a.durationMinutes)||0;
const all=()=>state.workouts.filter(w=>v456Visible(w.block)).slice().sort((a,b)=>a.date.localeCompare(b.date));
const completed=w=>w.status==='done'||!!w.matchId;
const thisWeek=()=>{const st=weekStart(today()),en=add(st,6);return {st,en,planned:all().filter(w=>w.date>=st&&w.date<=en),actual:activities().filter(a=>String(a.date).slice(0,10)>=st&&String(a.date).slice(0,10)<=en)}};
const sportName=a=>sportOf(a)||'Other';
const durationBySport=(arr)=>{const result={};arr.forEach(a=>{const k=sportName(a);result[k]=(result[k]||0)+mins(a)});return result};
const safeDate=x=>/^\d{4}-\d{2}-\d{2}$/.test(x||'');
const pageNames={dashboard:['YOUR PERFORMANCE','Home'],calendar:['THE JOURNEY','Calendar'],builder:['THE CLIMB','Build your program'],performance:['THE PERSPECTIVE','Performance stats'],recovery:['THE RESET','Recovery'],goals:['YOUR TRAINING','Training programs'],insights:['THE BIGGER PICTURE','MILE Insights'],events:['RACE DAY','Events & PBs'],predictor:['WHAT IS POSSIBLE','Race Predictor'],settings:['YOUR ACCOUNT','Settings']};
const hero=p=>{const [ey,title]=pageNames[p]||['MILE.','Performance'];return '<div class="mile-v32-hero" data-page="'+p+'"><div class="mile-v32-eyebrow">MILE. / '+ey+'</div><h1>'+title+'</h1><p>MAKE IT LOOK EASY.</p></div>'};
const percent=(a,b)=>b>0?Math.min(100,Math.round(a/b*100)):0;
const progress=(a,b)=>'<div class="mile-v32-track"><span style="width:'+percent(a,b)+'%"></span></div>';
const metric=(title,value,body)=>'<div class="mile-v32-card"><div class="mile-v32-eyebrow">'+title+'</div><div class="mile-v32-big">'+value+'</div><p>'+body+'</p></div>';
function insights(){const w=thisWeek(),r=recoverySummary(),t=root().targets,done=w.planned.filter(completed).length,run=runKm(w.st,w.en),msgs=[];
 if(w.planned.length)msgs.push({h:'Training consistency',b:done+' of '+w.planned.length+' visible sessions are completed or Garmin-linked this week ('+percent(done,w.planned.length)+'%).'});
 if(t.runKm>0)msgs.push({h:'Running volume',b:run.toFixed(1)+' km recorded this week against your '+t.runKm+' km personal target.'});
 if(r.sleep!==null)msgs.push({h:'Sleep versus target',b:Number(r.sleep).toFixed(1)+' hours recorded against your '+t.sleepHours+'-hour preference. '+(r.sleep<t.sleepHours?'Below your selected target.':'At or above your selected target.')});
 if(r.hrv!==null)msgs.push({h:'HRV observation',b:Math.round(r.hrv)+' ms overnight HRV. '+(r.status?'Garmin status: '+r.status+'.':'Compare against your personal baseline over time.')});
 const logs=Object.entries(state.checkins||{}).filter(([d,v])=>d>=add(today(),-6)&&d<=today()&&v?.fatigue);if(logs.length)msgs.push({h:'Your check-ins',b:logs.length+' fatigue check-ins recorded in the past seven days. Most recent reported fatigue: '+logs.sort((a,b)=>b[0].localeCompare(a[0]))[0][1].fatigue+'/10.'});
 return '<div class="mile-v32-grid">'+(msgs.length?msgs.map(x=>'<div class="mile-v32-card"><div class="mile-v32-eyebrow">OBSERVED TREND</div><h3>'+clean(x.h)+'</h3><p>'+clean(x.b)+'</p></div>').join(''):'<div class="mile-v32-card">Import activities or record a recovery check-in to unlock your first insight.</div>')+'</div><p class="mile-v32-mini">Insights are automatic, rule-based observations, not medical diagnoses or AI-generated coaching advice.</p>'}
function eventPage(){const r=root();return '<div class="mile-v32-grid"><section class="mile-v32-card"><details class="mile-premium-collapse"><summary>＋ Add an event</summary><div class="mile-v32-form"><div class="wide"><label>Event name</label><input id="m32EventName" maxlength="90" placeholder="e.g. Melbourne Marathon"></div><div><label>Date</label><input type="date" id="m32EventDate"></div><div><label>Sport</label><select id="m32EventSport"><option>Running</option><option>HYROX</option><option>Triathlon</option><option>Cycling</option><option>Swimming</option><option>Other</option></select></div><div><label>Distance / division</label><input id="m32EventDistance" placeholder="e.g. 21.1 km / Mixed Doubles"></div><div><label>Target time</label><input id="m32EventTarget" placeholder="e.g. 1:35:00"></div><div><label>Actual result (optional)</label><input id="m32EventResult" placeholder="e.g. 1:34:50"></div></div><button class="btn" onclick="mile32AddEvent()">Save event</button></details></section><section class="mile-v32-card"><details class="mile-premium-collapse"><summary>＋ Add a personal best</summary><div class="mile-v32-form"><div><label>Distance / event</label><select id="m32PbDistance"><option value="5">5 km</option><option value="10">10 km</option><option value="21.0975">Half marathon</option><option value="42.195">Marathon</option><option value="hyrox-single">HYROX Singles</option><option value="hyrox-double">HYROX Doubles</option></select></div><div><label>Time (h:mm:ss or mm:ss)</label><input id="m32PbTime" placeholder="e.g. 1:42:55"></div><div class="wide"><label>Date (optional)</label><input id="m32PbDate" type="date"></div></div><button class="btn" onclick="mile32AddPB()">Save PB</button></details><div class="mile-v32-rows" style="margin-top:14px">'+r.pbs.map((p,i)=>'<div class="mile-v32-row mile-premium-pb"><div class="mile-pb-medal">★</div><div><div class="mile-v32-eyebrow">PERSONAL BEST</div><strong>'+clean(p.label)+'</strong><div class="mile-pb-time">'+clean(p.time)+'</div><div class="mile-v32-mini">'+clean(p.date)+'</div></div><div class="mile-pb-actions"><button class="btn sm" onclick="mileSharePB('+i+')">Save Image</button><button class="btn alt sm" onclick="mile32DeletePB('+i+')">Remove</button></div></div>').join('')+'</div></section></div><section class="mile-v32-card"><h3>Race calendar</h3><div class="mile-v32-grid">'+(r.events.length?r.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>'<div class="mile-v32-card"><div class="mile-v32-image" role="img" aria-label="Branded mountain landscape"></div><div class="mile-v32-eyebrow">'+clean(e.sport)+'</div><h3>'+clean(e.name)+'</h3><p>'+clean(e.date)+' · '+clean(e.distance)+'</p><p>Target: '+clean(e.target||'Not set')+' · Result: '+clean(e.result||'Not entered')+'</p><span class="mile-v32-tag">'+(countDown(e.date)>=0?countDown(e.date)+' days to go':'Event completed')+'</span><div><button class="btn alt sm" onclick="mile32DeleteEvent(\''+clean(e.id)+'\')">Remove event</button></div></div>').join(''):'<p class="mile-v32-empty">No events added yet. Use the form above to create your first race card.</p>')+'</div></section>'}
window.mile32AddEvent=()=>{const get=id=>document.getElementById(id)?.value.trim()||'';const name=get('m32EventName'),date=get('m32EventDate');if(!name||!safeDate(date))return notice('Enter an event name and date');root().events.push({id:'e'+Date.now(),name,date,sport:get('m32EventSport'),distance:get('m32EventDistance'),target:get('m32EventTarget'),result:get('m32EventResult')});save();notice('Event saved')};
window.mile32DeleteEventByIndex=i=>{if(!confirm('Remove this event?'))return;root().events.splice(i,1);save()};
function parseTime(s){const parts=s.split(':').map(Number);if(parts.some(n=>!Number.isFinite(n))||parts.length<2||parts.length>3||parts.some(n=>n<0))return null;if(parts.slice(1).some(n=>n>=60))return null;return parts.reduce((a,n)=>a*60+n,0)}
window.mile32AddPB=()=>{const label=document.getElementById('m32PbDistance').selectedOptions[0].textContent,dist=document.getElementById('m32PbDistance').value,time=document.getElementById('m32PbTime').value.trim(),date=document.getElementById('m32PbDate').value;if(!parseTime(time))return notice('Enter a valid time, such as 45:24 or 1:42:55');root().pbs.push({label,dist,time,date});save();notice('PB saved')};
window.mile32DeletePB=i=>{root().pbs.splice(i,1);save()};
function predictorPage(){return '<div class="mile-v32-grid"><section class="mile-v32-card"><h3>Running prediction</h3><p>Based on a manually entered PB or a comparable Garmin full-distance activity. Estimates use the Riegel distance model, with uncertainty increasing over longer distances.</p><div class="mile-v32-form" style="margin-top:14px"><div><label>Known result</label><select id="m32PredictSource"><option value="">Select a result</option>'+root().pbs.filter(p=>Number(p.dist)>0).map((p,i)=>'<option value="'+clean(p.dist)+'|'+clean(p.time)+'">'+clean(p.label)+' · '+clean(p.time)+'</option>').join('')+'</select></div><div><label>Target distance</label><select id="m32PredictDistance"><option value="5">5 km</option><option value="10">10 km</option><option value="21.0975">Half marathon</option><option value="42.195">Marathon</option></select></div></div><button class="btn" onclick="mile32PredictRun()">Calculate running estimate</button><div id="m32PredictRunResult" style="margin-top:14px"></div></section><section class="mile-v32-card"><h3>HYROX prediction</h3><p>Supports Singles and Doubles. A credible estimate needs a comparable HYROX result or sufficient station and running data. A running PB alone is not enough.</p><div class="mile-v32-form" style="margin-top:14px"><div><label>Division</label><select id="m32HyroxDivision"><option>Singles Open</option><option>Singles Pro</option><option>Doubles Men</option><option>Doubles Women</option><option>Doubles Mixed</option></select></div><div><label>Recent comparable result</label><select id="m32HyroxSource"><option value="">No previous HYROX result</option>'+root().pbs.filter(p=>p.dist.startsWith('hyrox')).map(p=>'<option value="'+clean(p.time)+'">'+clean(p.label)+' · '+clean(p.time)+'</option>').join('')+'</select></div></div><button class="btn" onclick="mile32PredictHyrox()">Review HYROX estimate</button><div id="m32PredictHyroxResult" style="margin-top:14px"></div></section></div>'}
function fmtSeconds(n){const s=Math.round(n);return Math.floor(s/3600)?Math.floor(s/3600)+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'):Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
window.mile32PredictRun=()=>{const source=document.getElementById('m32PredictSource').value,out=document.getElementById('m32PredictRunResult');if(!source){out.innerHTML='<p class="mile-v32-empty">Add a verified running PB under Events & PBs first.</p>';return}const [d,t]=source.split('|'),secs=parseTime(t),target=Number(document.getElementById('m32PredictDistance').value);if(!secs||!Number(d))return;const estimate=secs*Math.pow(target/Number(d),1.06),ratio=target/Number(d),margin=ratio>2?0.1:0.06;out.innerHTML=metric('ESTIMATED FINISH',fmtSeconds(estimate),'Indicative range: '+fmtSeconds(estimate*(1-margin))+' – '+fmtSeconds(estimate*(1+margin))+'. Based on '+clean(d)+' km in '+clean(t)+'. Not a guarantee.')};
window.mile32PredictHyrox=()=>{const out=document.getElementById('m32PredictHyroxResult'),time=document.getElementById('m32HyroxSource').value,division=document.getElementById('m32HyroxDivision').value;if(!time){out.innerHTML='<p class="mile-v32-empty">Insufficient HYROX data. Add a comparable result under Events & PBs; station splits and partner information would improve the estimate.</p>';return}out.innerHTML=metric('COMPARABLE RESULT',clean(time),'Your recorded HYROX result is a useful reference for '+clean(division)+', but without comparable division, station and partner data we cannot reliably forecast a new finish time.')};
function extraDashboard(){const w=thisWeek(),t=root().targets,done=w.planned.filter(completed).length,by=durationBySport(w.actual),r=recoverySummary(),fat=state.checkins?.[today()]?.fatigue;let readiness='Recovery data limited',reason='Record a check-in and sync Garmin recovery metrics for a fuller picture.';if(r.sleep!==null||fat){readiness='Ready to assess';reason='Sleep: '+(r.sleep===null?'not recorded':r.sleep.toFixed(1)+' h')+'; fatigue: '+(fat?fat+'/10':'not recorded (enter in Recovery)').replace('/10/10','/10')+'. ';if((r.sleep!==null&&r.sleep<t.sleepHours-1)||(fat&&Number(fat)>=7)){readiness='Take it steady';reason+='At least one recovery indicator is below your preference.'}else if(r.sleep!==null&&fat){readiness='Feeling on track';reason+='No obvious warning from these two indicators.'}}return '<div class="mile-v32-grid">'+metric('TRAINING READINESS',clean(readiness),clean(reason)+' Guidance only, not a medical assessment.')+'<div class="mile-v32-card"><div class="mile-v32-eyebrow">WEEKLY COMPLETION</div><div class="mile-v32-big">'+done+' / '+w.planned.length+'</div>'+progress(done,w.planned.length)+'<p>Visible scheduled sessions completed or Garmin-linked.</p></div><div class="mile-v32-card"><h3>Training time by sport</h3><div class="mile-v32-rows">'+(Object.entries(by).length?Object.entries(by).map(([k,v])=>'<div class="mile-v32-row"><strong>'+clean(k)+'</strong><span>'+fmt(v)+'</span></div>').join(''):'<p>No recorded activity duration this week.</p>')+'</div></div></div>'}
let statDays=7;
window.mile32StatsDays=n=>{statDays=n;render()};
function extraStats(){const from=add(today(),1-statDays),arr=activities().filter(a=>String(a.date).slice(0,10)>=from&&String(a.date).slice(0,10)<=today()),by=durationBySport(arr),max=Math.max(1,...Object.values(by)),allMinutes=arr.reduce((s,a)=>s+mins(a),0),w=thisWeek(),done=w.planned.filter(completed).length;return '<section class="mile-v32-card"><h3>Hybrid training distribution</h3><div class="mile-v32-filter">'+[7,30,90].map(n=>'<button class="'+(statDays===n?'active':'')+'" onclick="mile32StatsDays('+n+')">'+n+' days</button>').join('')+'</div><div class="mile-v32-big">'+fmt(allMinutes)+'</div><p>Total recorded training time</p><div class="mile-v32-sport-graph" style="margin-top:14px">'+(Object.entries(by).length?Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<div class="mile-v32-graphrow"><strong>'+clean(k)+'</strong>'+progress(v,max)+'<span>'+fmt(v)+'</span></div>').join(''):'<p>No activities in this period.</p>')+'</div></section><section class="mile-v32-card"><h3>Weekly training consistency</h3><div class="mile-v32-big">'+percent(done,w.planned.length)+'%</div>'+progress(done,w.planned.length)+'<p>'+done+' of '+w.planned.length+' scheduled sessions completed or Garmin-linked this week.</p></section>'}
function extraRecovery(){const days=Array.from({length:7},(_,i)=>add(today(),i-6));return '<section class="mile-v32-card"><h3>Seven-day recovery comparison</h3><div class="mile-v32-rows">'+days.map(d=>{const r=recoveryDay(d),sleep=recoveryNumber(r,'sleepHours','sleep'),hrv=recoveryNumber(r,'hrvMs','overnightHrv','hrv'),fat=state.checkins?.[d]?.fatigue;return '<div class="mile-v32-row"><strong>'+clean(d.slice(5))+'</strong><span>Sleep '+(sleep===null?'—':sleep.toFixed(1)+'h')+' · HRV '+(hrv===null?'—':Math.round(hrv)+'ms')+' · Fatigue '+(fat||'—')+'/10</span></div>'}).join('')+'</div><p class="mile-v32-mini" style="margin-top:12px">Missing values are shown as dashes, never estimated.</p></section>'}
function targetForm(){const t=root().targets;return '<section class="mile-v32-card"><h3>Personal training targets</h3><div class="mile-v32-form"><div><label>Weekly running target (km)</label><input type="number" id="m32TargetRun" min="0" max="300" step="1" value="'+clean(t.runKm)+'"></div><div><label>Sleep target (hours)</label><input type="number" id="m32TargetSleep" min="4" max="12" step="0.5" value="'+clean(t.sleepHours)+'"></div><div><label>Training days per week</label><input type="number" id="m32TargetDays" min="1" max="7" value="'+clean(t.days)+'"></div><div><label>Primary sport</label><select id="m32TargetSport">'+['Running','HYROX','Swimming','Cycling','Triathlon','Strength'].map(x=>'<option '+(x===t.primarySport?'selected':'')+'>'+x+'</option>').join('')+'</select></div></div><button class="btn" onclick="mile32SaveTargets()">Save personal targets</button></section>'}
window.mile32SaveTargets=()=>{const n=id=>Number(document.getElementById(id)?.value),run=n('m32TargetRun'),sleep=n('m32TargetSleep'),days=n('m32TargetDays');if(!Number.isFinite(run)||run<0||run>300||sleep<4||sleep>12||!Number.isInteger(days)||days<1||days>7)return notice('Check your training targets');root().targets={runKm:run,sleepHours:sleep,days,primarySport:document.getElementById('m32TargetSport').value};save();notice('Personal targets saved')};
function activityDetails(){return '<section class="mile-v32-card"><h3>Garmin activity details</h3><p class="muted small">Select a workout to view its recorded metrics.</p><div class="mile-v32-rows" style="margin-top:12px">'+activities().slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,30).map(a=>{const sport=sportName(a),type=String(a.type||'').toLowerCase(),endurance=/run|walk|cycl|bike|swim/i.test(sport+' '+type),distance=Number(a.distanceKm||0),duration=mins(a),hr=Number(a.averageHR||0),pace=Number(a.paceMinKm||0);const cells=[];if(endurance&&distance>0)cells.push(['Distance',distance.toFixed(2)+' km']);if(duration>0)cells.push(['Duration',fmt(duration)]);if(hr>0)cells.push(['Avg heart rate',Math.round(hr)+' bpm']);if(/run|walk/i.test(sport+' '+type)&&pace>0)cells.push(['Avg pace',formatPace(pace)]);return '<div class="mile-v32-row mile-v32-activity"><details style="width:100%"><summary class="mile-beta-activity-summary"><strong>'+clean(String(a.name||a.activityName||a.type||'Workout').replace(/[_-]/g,' ').replace(/\b\w/g,c=>c.toUpperCase()))+'</strong><time>'+clean(String(a.date).slice(0,10))+'</time></summary><div class="m389-detail-grid">'+(cells.length?cells.map(([label,value])=>'<div><small>'+label+'</small><strong>'+clean(value)+'</strong></div>').join(''):'<p class="muted small">No detailed metrics available for this activity.</p>')+'</div></details></div>'}).join('')+'</div></section>'}

const lbCategory=type=>{const t=String(type||'').toLowerCase();if(/run|jog|trail/.test(t))return 'Running';if(/cycl|bik|ride|spin/.test(t))return 'Cycling';if(/swim|pool/.test(t))return 'Swimming';if(/strength|weight|resistance|gym/.test(t))return 'Strength';if(/hiit|interval|tabata/.test(t))return 'HIIT';if(/cardio|fitness|elliptical|stair|row|ski|indoor/.test(t))return 'Cardio';return null};
const lbFactors={Running:1,Cycling:.8,Swimming:1.2,Strength:.9,HIIT:1.1,Cardio:1};
function lbPoints(p){
 const cat=lbCategory(p.activity_type),secs=Number(p.duration_s);
 if(!cat||!Number.isFinite(secs)||secs<600||secs>86400)return 0;
 const m=Math.min(180,secs/60),base=Math.min(60,m)+Math.min(60,Math.max(0,m-60))*.5+Math.max(0,m-120)*.25;

}

/* Applies to the real dashboard DOM generated by mile-ui-dashboard, not synthetic test cards. */
.mile-ui-dashboard .mile-ui-panel,
.mile-ui-dashboard .mile-ui-panel:not(.mile-ui-training) {
  background:var(--panel)!important;
  background-image:none!important;
  color:var(--text)!important;
  border-color:var(--line)!important;
}
.mile-ui-dashboard .mile-ui-panel :is(h1,h2,h3,strong,b,.mile-ui-recent,.mile-ui-sportrow) {color:var(--text)!important}
.mile-ui-dashboard .mile-ui-panel :is(small,.muted,.mile-ui-session span) {color:var(--muted)!important}
.mile-ui-dashboard .mile-ui-recent {background:var(--panel2)!important;border-color:var(--line)!important}
.mile-ui-dashboard .mile-ui-section {background:transparent!important}
.mile-ui-dashboard .mile-ui-section h2 {background:transparent!important;color:var(--text)!important}
.mile-ui-dashboard .mile-ui-sportrow {border-color:var(--line)!important}
.mile-ui-dashboard .mile-ui-ring {background:conic-gradient(var(--good) var(--ring),var(--line) 0)!important}
.mile-ui-dashboard .mile-ui-ring > div {background:var(--panel)!important;color:var(--text)!important}
.mile-ui-dashboard .mile-ui-training {
  /* Keep photo; replace fixed forest-green tint with theme-specific translucent overlay. */
  background-image:linear-gradient(90deg,var(--mile-image-overlay-strong),var(--mile-image-overlay-soft)),var(--mile-training-photo)!important;
  background-color:var(--panel)!important;
}
