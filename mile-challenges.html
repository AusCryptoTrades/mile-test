</style></head><body><header><button class="back" id="back">‹ Social</button><div class="logo">MILE<span class="lime">.</span></div><span class="eyebrow">COMPETE</span></header><div id="root"></div><div class="overlay" id="winner"><div class="row"><strong>YOU WON.</strong><button class="back" id="closeWinner">✕</button></div><p>Congratulations. Your winner image is ready.</p><div class="styles"><button data-style="black" class="active">BLACK</button><button data-style="white">WHITE</button></div><canvas id="winnerCanvas" width="1080" height="1350"></canvas><p class="small" style="text-align:center">Press and hold the image to save to Photos on iPhone.</p><button class="primary" id="saveWinner">Save image</button></div><script>
(function(){'use strict';
const themeMap={forest:['#09251a','#193b2b','#254d39','#37634a','#f2fff6','#aacbb8','#a3e9c3'],graphite:['#17191c','#292d31','#353b40','#495056','#f7f7f7','#b6bdc2','#ff914f'],midnight:['#0a142a','#182b4c','#223a5d','#385273','#f5faff','#b1c4e0','#4c9dff'],mono:['#080808','#222222','#303030','#505050','#ffffff','#c3c3c3','#ffffff'],light:['#f3f6f2','#ffffff','#e7eee9','#cbdad0','#173325','#536d5c','#367b55'],sand:['#f1e7d6','#e4d3b9','#eadbc6','#c9ae90','#39291f','#776353','#9b613b'],ice:['#eff8fc','#d9edf6','#e6f4fb','#a9cddd','#183b51','#587b8c','#317cb2']};function syncTheme(){let t='forest';try{t=parent.document.documentElement.dataset.m395Theme||JSON.parse(parent.localStorage.getItem('mile-appearance-v1')||'{}').theme||t}catch(_){}const c=themeMap[t]||themeMap.forest;['bg','panel','panel2','line','text','muted','accent'].forEach((k,i)=>document.documentElement.style.setProperty('--c-'+k,c[i]));document.documentElement.style.setProperty('--c-on-accent',['light','sand','ice','mono'].includes(t)?c[0]:'#101510');document.documentElement.style.colorScheme=['light','sand','ice'].includes(t)?'light':'dark'}syncTheme();setInterval(syncTheme,1200);const root=document.getElementById('root'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const api=()=>parent.m383SocialApi;const social=()=>parent.m36State||{};const uid=()=>String(parent.mileChallengesUserId?.()||'');
const types=['All','Running','HYROX','Cycling','Swimming','Strength','Multisport'];
const metrics={Running:['Total distance','Fastest 5K','Fastest 10K','Most sessions'],HYROX:['Fastest full SIM','Most sessions'],Cycling:['Total distance','Most sessions'],Swimming:['Total distance','Most sessions'],Strength:['Most sessions'],Multisport:['Most sessions','Total duration']};
let tab='Discover',sport='All',items=[],entries=[],current=null,winning=null,style='black',loading=false,error='',joined=new Set(),seen=new Set(JSON.parse(localStorage.getItem('mile-challenge-wins-seen')||'[]'));
const fmt=d=>new Date(d).toLocaleDateString('en-AU',{day:'numeric',month:'short'});
function nav(t){tab=t;render()}
function banner(){return '<section class="hero"><div class="eyebrow">SOCIAL / COMMUNITY</div><h1>CHALLENGES<span class="lime">.</span></h1><p>Compete. Progress. Train together.</p></section><div class="tabs">'+['Discover','My Challenges','History','Create'].map(t=>'<button data-tab="'+t+'" class="'+(tab===t?'active':'')+'">'+t+'</button>').join('')+'</div>'}
function summary(c){const n=entries.filter(e=>e.challenge_id===c.id).length;const active=new Date(c.ends_at)>new Date();return '<article class="card" data-open="'+esc(c.id)+'"><span class="tag">'+esc(c.sport)+' / '+(active?'ACTIVE':'FINISHED')+'</span><h2>'+esc(c.title)+'</h2><div class="muted small">'+esc(c.metric)+' · '+esc(c.scoring_rule)+'</div><div class="meta"><span>◷ '+fmt(c.starts_at)+' – '+fmt(c.ends_at)+'</span><span>♙ '+n+' joined</span><span>'+esc(c.visibility)+'</span></div><div class="row"><span class="muted small">'+(joined.has(c.id)?'JOINED':'VIEW CHALLENGE')+'</span><strong class="lime">↗</strong></div></article>'}
function discover(){let arr=items.filter(c=>sport==='All'||c.sport===sport);if(tab==='My Challenges')arr=arr.filter(c=>joined.has(c.id));if(tab==='History')arr=arr.filter(c=>new Date(c.ends_at)<=new Date());if(tab!=='History')arr=arr.filter(c=>new Date(c.ends_at)>new Date());return '<div class="filters">'+types.map(t=>'<button data-sport="'+t+'" class="'+(sport===t?'active':'')+'">'+t+'</button>').join('')+'</div><div class="cards">'+(arr.map(summary).join('')||'<p class="muted">No challenges here yet. Create one to get started.</p>')+'</div>'}
function create(){return '<form id="challengeForm"><h2>CREATE A CHALLENGE<span class="lime">.</span></h2><p class="form-intro">Set a goal, choose the rules and compete with the MILE community.</p><div class="section-label"><span>01</span> Challenge identity</div><div class="field"><label>Challenge title</label><input name="title" maxlength="80" required placeholder="December Run Volume"></div><div class="grid"><div class="field"><label>Sport</label><select name="sport" id="sportSelect">'+types.slice(1).map(x=>'<option>'+x+'</option>').join('')+'</select></div><div class="field"><label>Activity / goal</label><select name="metric" id="metricSelect"></select></div></div><div class="section-label"><span>02</span> Scoring &amp; targets</div><div class="field"><label>Target (optional, e.g. 100 km)</label><input name="target" maxlength="40" placeholder="100 km"></div><div class="field"><label>Scoring</label><select name="scoring_rule" id="scoringRule"><option>Highest total wins</option><option>Lowest time wins</option></select></div><div class="section-label"><span>03</span> Schedule &amp; access</div><div class="grid"><div class="field"><label>Starts</label><input type="date" name="starts_at" required></div><div class="field"><label>Ends</label><input type="date" name="ends_at" required></div></div><div class="grid"><div class="field"><label>Visibility</label><select name="visibility"><option value="public">Public</option></select></div><div class="field"><label>Eligible athletes</label><select name="eligibility"><option value="all">All athletes</option></select></div></div><div class="field"><label>Rules / description</label><input name="description" maxlength="300" placeholder="What counts towards the challenge?"></div><div class="form-footer"><button class="primary">Create challenge →</button></div></form>'}
function scores(c){return entries.filter(x=>x.challenge_id===c.id&&Number(x.qualifying_count||0)>0).sort((a,b)=>c.scoring_rule==='Lowest time wins'?Number(a.score)-Number(b.score):Number(b.score)-Number(a.score))}
function detail(){let c=current;if(!c)return '';let e=scores(c),isJoined=joined.has(c.id);return '<button class="back" id="goBack">‹ All challenges</button><div class="card"><span class="tag">'+esc(c.sport)+'</span><h1>'+esc(c.title)+'</h1><p>'+esc(c.description||c.metric)+'</p><div class="meta"><span>'+fmt(c.starts_at)+' – '+fmt(c.ends_at)+'</span><span>'+esc(c.visibility)+'</span></div><div class="row"><span>'+esc(c.metric)+'</span><strong>'+esc(c.target||c.scoring_rule)+'</strong></div></div><h2>LEADERBOARD</h2><div class="card">'+(e.map((r,i)=>'<div class="rank"><span class="place">'+(i+1)+'</span><span class="name">'+esc(r.display_name||'MILE Athlete')+'</span><span class="score">'+esc(r.score)+' '+esc(r.unit||'')+'</span></div>').join('')||'<p class="muted">No verified results yet.</p>')+'</div><div class="notice">Results must be verified from MILE activities. Manual scores are not accepted.</div>'+(isJoined?'<p class="muted">You have joined this challenge.</p>':'<button class="primary" id="join">Join challenge</button>')}
function render(){root.innerHTML=banner()+(error?'<p class="error">'+esc(error)+'</p>':'')+(loading?'<p>Loading challenges…</p>':current?detail():tab==='Create'?create():discover());if(tab==='Create'&&!current){let s=document.getElementById('sportSelect'),m=document.getElementById('metricSelect');function update(){m.innerHTML=metrics[s.value].map(x=>'<option>'+x+'</option>').join('')}s.onchange=update;m.onchange=()=>{document.getElementById('scoringRule').value=m.value.startsWith('Fastest')?'Lowest time wins':'Highest total wins'};const oldUpdate=update;function updateScore(){oldUpdate();m.onchange()}s.onchange=updateScore;updateScore();const today=new Date().toLocaleDateString('en-CA');root.querySelector('[name=starts_at]').value=today;root.querySelector('[name=ends_at]').value=new Date(Date.now()+7*86400000).toISOString().slice(0,10)}}
async function load(){loading=true;render();try{const a=api();if(!a)throw Error('Sign in to MILE to use challenges');const [c,e]=await Promise.all([a('mile_challenges','GET',null,'?select=*&order=created_at.desc&limit=100'),a('mile_challenge_entries','GET',null,'?select=*&limit=1000')]);items=c;entries=e;joined=new Set(e.filter(x=>x.user_id===uid()).map(x=>x.challenge_id));error='';checkWins()}catch(e){error=e.message+' — Challenge database setup may still be required.'}finally{loading=false;render()}}
async function createChallenge(f){let d=Object.fromEntries(new FormData(f));if(new Date(d.ends_at)<=new Date(d.starts_at))throw Error('End date must be after start date');let obj={title:d.title,sport:d.sport,metric:d.metric,target:d.target||null,scoring_rule:d.scoring_rule,starts_at:new Date(d.starts_at+'T00:00:00').toISOString(),ends_at:new Date(d.ends_at+'T23:59:59').toISOString(),visibility:d.visibility,eligibility:d.eligibility,description:d.description||'',created_by:uid()};await api()('mile_challenges','POST',obj);tab='My Challenges';await load()}
async function join(){await api()('mile_challenge_entries','POST',{challenge_id:current.id,user_id:uid()});await load()}
function checkWins(){for(const c of items){if(new Date(c.ends_at)>new Date()||new Date(c.starts_at)>new Date())continue;let ranking=scores(c);if(ranking.length&&ranking[0].user_id===uid()&&(ranking.length===1||Number(ranking[0].score)!==Number(ranking[1].score))&&!seen.has(c.id)){winning={c,entry:ranking[0]};showWinner();break}}}
function showWinner(){document.getElementById('winner').classList.add('open');drawWinner();seen.add(winning.c.id);localStorage.setItem('mile-challenge-wins-seen',JSON.stringify([...seen]))}
function drawWinner(){if(!winning)return;const prior=document.getElementById('winnerPhoto');if(prior){URL.revokeObjectURL(prior.src);prior.remove()}const canvas=document.getElementById('winnerCanvas');canvas.style.display='block';const ctx=canvas.getContext('2d'),light=style==='white',fg=light?'#101310':'#fff';ctx.fillStyle=light?'#f5f6f1':'#0b0d0c';ctx.fillRect(0,0,1080,1350);ctx.fillStyle='#c7ff35';ctx.fillRect(70,125,115,13);ctx.fillRect(70,1120,940,10);ctx.fillStyle=fg;ctx.font='900 95px Arial';ctx.fillText('MILE.',70,100);ctx.font='italic 900 106px Arial';ctx.fillText('CHALLENGE',70,400);ctx.fillStyle='#c7ff35';ctx.fillText('WINNER',70,520);ctx.fillStyle=fg;ctx.font='bold 48px Arial';ctx.fillText(winning.c.title.slice(0,30).toUpperCase(),70,650);ctx.font='900 125px Arial';ctx.fillText(String(winning.entry.score)+' '+(winning.entry.unit||''),70,850);ctx.font='bold 37px Arial';ctx.fillText(winning.entry.display_name||'MILE ATHLETE',70,970);ctx.font='28px Arial';ctx.fillText('RANK 01  /  '+fmt(winning.c.ends_at),70,1040);ctx.font='bold 30px Arial';ctx.fillText('MAKE IT LOOK EASY',70,1240);canvas.toBlob(blob=>{if(!blob)return;const old=document.getElementById('winnerPhoto');if(old)old.remove();const img=document.createElement('img');img.id='winnerPhoto';img.src=URL.createObjectURL(blob);img.alt='MILE challenge winner card, hold to save';img.style.cssText='display:block;width:min(100%,390px);margin:12px auto';canvas.after(img);canvas.style.display='none'},'image/png')}
root.addEventListener('click',async e=>{let b=e.target.closest('button,[data-open]');if(!b)return;try{if(b.dataset.tab){current=null;nav(b.dataset.tab)}else if(b.dataset.sport){sport=b.dataset.sport;render()}else if(b.dataset.open){current=items.find(c=>c.id===b.dataset.open);render()}else if(b.id==='goBack'){current=null;render()}else if(b.id==='join'){await join()}}catch(err){error=err.message;render()}});
root.addEventListener('submit',async e=>{if(e.target.id!=='challengeForm')return;e.preventDefault();try{await createChallenge(e.target)}catch(err){error=err.message;render()}});
document.getElementById('back').onclick=()=>{if(parent!==window&&parent.mileCloseChallenges)parent.mileCloseChallenges();else location.href='./index.html'};

document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{style=b.dataset.style;document.querySelectorAll('[data-style]').forEach(x=>x.classList.toggle('active',x===b));drawWinner()});
document.getElementById('saveWinner').onclick=()=>{let a=document.createElement('a');a.href=document.getElementById('winnerPhoto')?.src||document.getElementById('winnerCanvas').toDataURL();a.download='MILE-Challenge-Winner.png';a.click()};
load();
})();
