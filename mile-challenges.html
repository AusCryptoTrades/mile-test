function render(){root.innerHTML=banner()+(error?'<p class="error">'+esc(error)+'</p>':'')+(loading?'<p>Loading challenges…</p>':current?detail():tab==='Create'?create():discover());if(tab==='Create'&&!current){let s=document.getElementById('sportSelect'),m=document.getElementById('metricSelect');function update(){m.innerHTML=metrics[s.value].map(x=>'<option>'+x+'</option>').join('')}s.onchange=update;m.onchange=()=>{document.getElementById('scoringRule').value=m.value.startsWith('Fastest')?'Lowest time wins':'Highest total wins'};const oldUpdate=update;function updateScore(){oldUpdate();m.onchange()}s.onchange=updateScore;updateScore();const today=new Date().toLocaleDateString('en-CA');root.querySelector('[name=starts_at]').value=today;root.querySelector('[name=ends_at]').value=new Date(Date.now()+7*86400000).toISOString().slice(0,10)}}
async function load(){loading=true;render();try{const a=api();if(!a)throw Error('Sign in to MILE to use challenges');const [c,e]=await Promise.all([a('mile_challenges','GET',null,'?select=*&order=created_at.desc&limit=100'),a('mile_challenge_entries','GET',null,'?select=*&limit=1000')]);items=c;entries=e;joined=new Set(e.filter(x=>x.user_id===uid()).map(x=>x.challenge_id));error='';checkWins()}catch(e){error=e.message+' — Challenge database setup may still be required.'}finally{loading=false;render()}}
async function createChallenge(f){let d=Object.fromEntries(new FormData(f));if(new Date(d.ends_at)<=new Date(d.starts_at))throw Error('End date must be after start date');let obj={title:d.title,sport:d.sport,metric:d.metric,target:d.target||null,scoring_rule:d.scoring_rule,starts_at:new Date(d.starts_at+'T00:00:00').toISOString(),ends_at:new Date(d.ends_at+'T23:59:59').toISOString(),visibility:d.visibility,eligibility:d.eligibility,description:d.description||'',created_by:uid()};await api()('mile_challenges','POST',obj);tab='My Challenges';await load()}
async function join(){await api()('mile_challenge_entries','POST',{challenge_id:current.id,user_id:uid()});await load()}
function checkWins(){for(const c of items){if(new Date(c.ends_at)>new Date()||new Date(c.starts_at)>new Date())continue;let ranking=scores(c);if(ranking.length&&ranking[0].user_id===uid()&&(ranking.length===1||Number(ranking[0].score)!==Number(ranking[1].score))&&!seen.has(c.id)){winning={c,entry:ranking[0]};showWinner();break}}}
function showWinner(){document.getElementById('winner').classList.add('open');drawWinner();seen.add(winning.c.id);localStorage.setItem('mile-challenge-wins-seen',JSON.stringify([...seen]))}
function drawWinner(){if(!winning)return;const prior=document.getElementById('winnerPhoto');if(prior){URL.revokeObjectURL(prior.src);prior.remove()}const canvas=document.getElementById('winnerCanvas');canvas.style.display='block';const ctx=canvas.getContext('2d'),light=style==='white',fg=light?'#101310':'#fff';ctx.fillStyle=light?'#f5f6f1':'#0b0d0c';ctx.fillRect(0,0,1080,1350);ctx.fillStyle='#c7ff35';ctx.fillRect(70,125,115,13);ctx.fillRect(70,1120,940,10);ctx.fillStyle=fg;ctx.font='900 95px Arial';ctx.fillText('MILE.',70,100);ctx.font='italic 900 106px Arial';ctx.fillText('CHALLENGE',70,400);ctx.fillStyle='#c7ff35';ctx.fillText('WINNER',70,520);ctx.fillStyle=fg;ctx.font='bold 48px Arial';ctx.fillText(winning.c.title.slice(0,30).toUpperCase(),70,650);ctx.font='900 125px Arial';ctx.fillText(String(winning.entry.score)+' '+(winning.entry.unit||''),70,850);ctx.font='bold 37px Arial';ctx.fillText(winning.entry.display_name||'MILE ATHLETE',70,970);ctx.font='28px Arial';ctx.fillText('RANK 01  /  '+fmt(winning.c.ends_at),70,1040);ctx.font='bold 30px Arial';ctx.fillText('MAKE IT LOOK EASY',70,1240);canvas.toBlob(blob=>{if(!blob)return;const old=document.getElementById('winnerPhoto');if(old)old.remove();const img=document.createElement('img');img.id='winnerPhoto';img.src=URL.createObjectURL(blob);img.alt='MILE challenge winner card, hold to save';img.style.cssText='display:block;width:min(100%,390px);margin:12px auto';canvas.after(img);canvas.style.display='none'},'image/png')}
root.addEventListener('click',async e=>{let b=e.target.closest('button,[data-open]');if(!b)return;try{if(b.dataset.tab){current=null;nav(b.dataset.tab);window.scrollTo({top:0,behavior:'instant'})}else if(b.dataset.sport){sport=b.dataset.sport;render()}else if(b.dataset.open){current=items.find(c=>c.id===b.dataset.open);render()}else if(b.id==='goBack'){current=null;render()}else if(b.id==='join'){await join()}}catch(err){error=err.message;render()}});
root.addEventListener('submit',async e=>{if(e.target.id!=='challengeForm')return;e.preventDefault();try{await createChallenge(e.target)}catch(err){error=err.message;render()}});
function goHome(){if(parent!==window){parent.mileCloseChallenges?.();parent.mileV3Go?.('dashboard')}else location.href='./index.html'}
document.getElementById('mileHome').onclick=goHome;
document.getElementById('mileProfile').onclick=()=>{if(parent!==window){parent.mileCloseChallenges?.();parent.m36Drawer?.()}else location.href='./index.html'};
document.getElementById('mileSignout').onclick=()=>{if(parent!==window){parent.mileCloseChallenges?.();const sign=parent.document.getElementById('v4SignOut');if(sign)sign.click();else parent.v4Logout?.()}else location.href='./index.html'};
try{const profile=parent.document.querySelector('.m36-head img,.m36-head-profile img,.m361-profile-avatar img,.top img');if(profile?.src){const img=document.createElement('img');img.src=profile.src;img.alt='Profile';document.getElementById('mileProfile').replaceChildren(img)}}catch(_){};
document.getElementById('closeWinner').onclick=()=>document.getElementById('winner').classList.remove('open');
document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{style=b.dataset.style;document.querySelectorAll('[data-style]').forEach(x=>x.classList.toggle('active',x===b));drawWinner()});
document.getElementById('saveWinner').onclick=()=>{let a=document.createElement('a');a.href=document.getElementById('winnerPhoto')?.src||document.getElementById('winnerCanvas').toDataURL();a.download='MILE-Challenge-Winner.png';a.click()};
load();
})();
